# Non-data unit tests for nornir-buildmanager (no PlatformTest / volume corpus).

name: Python application

on:
  push:
    branches: [ "master", "dev", "CuPy" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CURSES: "False"
  TERM: xterm
  ECLIPSE: ECLIPSE
  NORNIR_HEADLESS: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install pytest python-dotenv validators "numpy>=1.26" "scipy>=1.11" "matplotlib>=3.8" "Pillow>=10.2" "pydantic>=2.9.2" "six>=1.16" "scikit-image>=0.25.1" "hypothesis>=6.96"
        python -m pip install "nornir_shared @ git+https://github.com/jamesra/nornir-shared.git@dev"
        python -m pip install "nornir_pools @ git+https://github.com/jamesra/nornir-pools.git@master" --no-deps
        python -m pip install "nornir_imageregistration @ git+https://github.com/jamesra/nornir-imageregistration.git@dev" --no-deps
        python -m pip install . --no-deps
        python -c "import nornir_shared.mqtt_telemetry; import nornir_buildmanager; print('install ok')"

    - name: Create test data folders (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p ${{ github.workspace }}/testdata ${{ github.workspace }}/testdata_output
        echo "TESTINPUTPATH=${{ github.workspace }}/testdata" >> $GITHUB_ENV
        echo "TESTOUTPUTPATH=${{ github.workspace }}/testdata_output" >> $GITHUB_ENV

    - name: Create test data folders (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir -p ${{ github.workspace }}\testdata
        mkdir -p ${{ github.workspace }}\testdata_output
        echo "TESTINPUTPATH=${{ github.workspace }}\testdata" >> $env:GITHUB_ENV
        echo "TESTOUTPUTPATH=${{ github.workspace }}\testdata_output" >> $env:GITHUB_ENV

    - name: Run unit tests
      run: >
        python -m pytest -q
        tests/pipeline/test_pipelinemanager.py
        tests/pipeline/test_iterate_filters.py
        tests/pipeline/test_argparsexml.py
        tests/pipeline/test_build_early_meta.py
        tests/pipeline/test_audit_regressions.py
        tests/pipeline/test_sync_validation_times.py
        tests/pipeline/test_migration.py
        tests/validation/test_validation.py
        tests/importers/test_shared.py
        tests/test_no_delete.py
        tests/operations/test_slice_to_volume_chain.py
        tests/operations/test_tile_io_worker_count.py
        tests/operations/test_vikingxml.py
        tests/pipeline/test_pipeline_mqtt_events.py
        tests/pipeline/test_transform_refine_orchestrator.py
        tests/pipeline/test_VolumeManager.py
        tests/pipeline/metadata/test_tilesetinfo.py
        tests/volumemanager/test_save_xml.py
